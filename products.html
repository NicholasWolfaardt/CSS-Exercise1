<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><h1><b>My Online Store</b></h1></header>
  <main class="grid">
    <div class="card">
      <img src="https://m.media-amazon.com/images/I/71amTCrzOdL._AC_SX679_.jpg" alt="Ghast Headphones">
      <p><label>Ghast Headphones</label></p>
      <p><label>R 3999</label></p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://m.media-amazon.com/images/I/61l1VOHokOL._AC_SX679_.jpg" alt="Yellow Wolverine PS5 Dualsense">
      <p><label>Yellow Wolverine PS5 Dualsense</label></p>
      <p><label>R 1499</label></p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://www.stormforcegaming.co.uk/wp-content/uploads/2026/05/Mouse-block-1000x1000.webp" alt="Cable Guy: DoomSlayer">
      <p><label>Razer Black Gaming Mouse</label></p>
      <p><label>R 397</label></p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://sonyworld.co.za/cdn/shop/files/ACCESS_SA_RNDR_FT_RGB_MEA_231002.jpg?" alt="Playstation 5 Access Controller">
      <p><label>Playstation 5 Access Controller</label></p>
      <p><label>R 999</label></p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://www.mhcworld.co.za/cdn/shop/files/transparent-Photoroom_21_7f615aef-4e55-4465-916c-a359e4e29214.jpg?" alt="Logitech G920/G29 Driving Force Steering Wheel and Pedals">
      <p><label>Logitech G920/G29 Driving Force Steering Wheel and Pedals</label></p>
      <p><label>R 6099</label></p>
      <button>Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/HS4G2?" alt="Backbone Pro Mobile Gaming">
      <p><label>Backbone Pro Mobile Gaming</label></p>
      <p><label>R 2786</label></p>
      <button>Add to Cart</button>
    </div>
  </main>
</body>
</html>
